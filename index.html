<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pintar PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animasi Loading Spinner Modern */
        .loader {
            width: 40px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: 
                radial-gradient(farthest-side,#10b981 94%,#0000) top/6px 6px no-repeat,
                conic-gradient(#0000 30%,#10b981);
            -webkit-mask: radial-gradient(farthest-side,#0000 calc(100% - 6px),#000 0);
            animation: l13 1s infinite linear;
        }
        @keyframes l13 { 100% {transform: rotate(1turn)} }
        
        .hidden { display: none !important; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <div id="main-app" class="flex-1 flex flex-col md:flex-row h-full relative">
        
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-[#F8FAFC]">
            
            <div class="bg-white px-6 py-4 shadow-sm z-10 flex justify-between items-center border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-500/20 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30 text-white">
                        <img src="logos.svg"  alt="">
                    </div>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-800 tracking-tight leading-none">Bakso<span class="text-emerald-500">dirgo</span></h1>
                        <p class="text-[11px] text-slate-400 font-medium">Food and Drinks</p>
                    </div>
                </div>
                
                <div class="flex gap-2 items-center">
                    <button onclick="toggleHistory()" class="flex items-center justify-center w-10 h-10 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 active:scale-95 transition-all border border-blue-100" title="Riwayat">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                    <button onclick="openAddModal()" class="flex items-center justify-center w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl hover:bg-emerald-100 active:scale-95 transition-all border border-emerald-100" title="Tambah Produk">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <button onclick="syncData()" class="flex items-center justify-center w-10 h-10 bg-slate-50 text-slate-600 rounded-xl hover:bg-slate-100 active:scale-95 transition-all border border-slate-200" title="Reload Data">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                    <a href="dashboard.html" class="flex items-center justify-center w-10 h-10 bg-slate-800 text-white rounded-xl hover:bg-slate-700 active:scale-95 transition-all shadow-md ml-1" title="Dashboard Admin">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
            </div>

            <div id="product-container" class="flex-1 overflow-y-auto p-6 pb-40 md:pb-6 relative">
                <div id="loading-indicator" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center hidden">
                    <div class="loader mb-4"></div>
                    <p class="text-emerald-600 font-bold tracking-wide animate-pulse">Menyiapkan Data...</p>
                </div>
                <div id="product-grid" class="max-w-7xl mx-auto"></div>
            </div>
        </div>

        <div class="w-full md:w-[400px] bg-white flex flex-col h-auto md:h-full fixed md:relative bottom-0 z-20 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.15)] md:shadow-[-10px_0_30px_-15px_rgba(0,0,0,0.1)] rounded-t-[2rem] md:rounded-none border-l border-slate-100 transition-transform duration-300">
            
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-[2rem] md:rounded-none">
                <h2 class="font-extrabold text-lg flex items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Struk Pesanan
                </h2>
                <span id="cart-badge" class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full">0 Item</span>
            </div>
            
            <div id="cart-list" class="flex-1 overflow-y-auto p-6 max-h-[40vh] md:max-h-full bg-slate-50/50">
                <div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-60 mt-10 md:mt-0">
                    <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="text-sm font-medium">Keranjang masih kosong</p>
                </div>
            </div>

            <div class="p-6 bg-white border-t border-slate-100">
                <div class="flex justify-between items-center mb-5">
                    <span class="text-sm font-bold text-slate-400 tracking-wide">TOTAL TAGIHAN</span>
                    <span id="grand-total" class="text-3xl font-black text-slate-800 tracking-tight">Rp 0</span>
                </div>
                <button id="btn-checkout" onclick="checkout()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-lg py-4 rounded-2xl shadow-xl shadow-emerald-500/30 hover:shadow-emerald-500/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    PROSES PEMBAYARAN
                </button>
            </div>
        </div>
    </div>

    <div id="add-modal" class="hidden absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-100 transition-opacity">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl transform scale-100 transition-transform">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-extrabold text-xl text-slate-800">Produk Baru</h2>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-rose-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">Kategori</label>
                    <input type="text" id="new-cat" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all font-medium" placeholder="Cth: Minuman Dingin">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">Nama Menu</label>
                    <input type="text" id="new-name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all font-medium" placeholder="Cth: Es Teh Manis">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 mb-1 block">Harga Jual (Rp)</label>
                    <input type="number" id="new-price" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all font-medium" placeholder="Cth: 5000">
                </div>
            </div>
            
            <button id="btn-save-product" onclick="submitProduct()" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-700 active:scale-95 transition-all shadow-lg shadow-slate-800/20">
                Simpan Produk
            </button>
        </div>
    </div>

    <div id="history-screen" class="hidden absolute inset-0 bg-slate-50 z-40 flex flex-col">
        <div class="bg-white px-6 py-4 shadow-sm flex justify-between items-center border-b border-slate-200">
            <h1 class="font-extrabold text-xl text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Riwayat Hari Ini
            </h1>
            <button onclick="toggleHistory()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold hover:bg-slate-200 active:scale-95 transition-all text-sm">
                Kembali
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full" id="history-list">
            <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p class="font-medium">Belum ada transaksi hari ini.</p>
            </div>
        </div>
    </div>

    <script>
        // ======= KONFIGURASI =======
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzux4ms8rD5RionZ0mgExFct4wSqQeoor2UQoHpHA5gprIbmqVAB8O0r7nyJsevvWAZw/exec"; // Wajib diisi!
        // ===========================

        let cart = [];
        let dbProducts = [];
        let dbHistory = [];

        // Auto Load saat awal
        syncData(); 

        function generateTrxId() {
            const now = new Date();
            const dateStr = now.getFullYear().toString() + (now.getMonth() + 1).toString().padStart(2, '0') + now.getDate().toString().padStart(2, '0');
            const random = Math.floor(Math.random() * 9000) + 1000;
            return `TRX-${dateStr}-${random}`;
        }

        async function syncData() {
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('product-grid').innerHTML = '';
            
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "get_data" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    dbProducts = result.products;
                    dbHistory = result.history;
                    renderProducts();
                    renderHistory();
                }
            } catch (err) {
                alert("Gagal sinkronisasi data. Cek koneksi internet Anda.");
            }
            document.getElementById('loading-indicator').classList.add('hidden');
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (dbProducts.length === 0) {
                grid.innerHTML = `
                <div class="flex flex-col items-center justify-center mt-20 opacity-60">
                    <svg class="w-16 h-16 text-slate-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    <p class="text-slate-500 font-medium">Belum ada menu. Klik Tambah Produk.</p>
                </div>`;
                return;
            }

            const categories = {};
            dbProducts.forEach(p => {
                if (!categories[p.kategori]) categories[p.kategori] = [];
                categories[p.kategori].push(p);
            });

            let html = '';
            for (const [cat, items] of Object.entries(categories)) {
                // UI Header Kategori Baru
                html += `
                <div class="w-full mt-6 mb-4 flex items-center gap-3">
                    <span class="bg-slate-800 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-sm">${cat}</span>
                    <div class="h-px bg-slate-200 flex-1"></div>
                </div>`;
                
                html += `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-2">`;
                
                items.forEach(item => {
                    // UI Tombol Produk Baru
                    html += `
                    <button onclick="addToCart('${item.nama}', ${item.harga})" class="group relative bg-white border border-slate-200 hover:border-emerald-400 rounded-2xl p-4 flex flex-col justify-between min-h-[110px] active:scale-[0.97] transition-all shadow-sm hover:shadow-md text-left overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                        <span class="font-bold text-slate-700 text-sm leading-tight z-10 pr-2">${item.nama}</span>
                        <div class="mt-3 z-10">
                            <span class="inline-block text-xs font-extrabold text-emerald-700 bg-emerald-100/80 px-2 py-1 rounded-md border border-emerald-200/50 shadow-sm">
                                Rp ${item.harga.toLocaleString('id-ID')}
                            </span>
                        </div>
                    </button>`;
                });
                html += `</div>`;
            }
            grid.innerHTML = html;
        }

        function addToCart(name, price) {
            if (navigator.vibrate) navigator.vibrate(40);
            const item = cart.find(i => i.name === name);
            if (item) item.qty += 1;
            else cart.push({ name, price, qty: 1 });
            renderCart();
        }

        function removeCart(index) {
            if (navigator.vibrate) navigator.vibrate(40);
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const badge = document.getElementById('cart-badge');
            
            // Hitung total kuantitas barang
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = `${totalItems} Item`;

            if (cart.length === 0) {
                list.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-60 mt-10 md:mt-0">
                    <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="text-sm font-medium">Keranjang masih kosong</p>
                </div>`;
                document.getElementById('grand-total').innerText = 'Rp 0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((c, i) => {
                const sub = c.price * c.qty;
                total += sub;
                // UI Cart Item Baru
                html += `
                <div class="flex justify-between items-center py-4 border-b border-slate-200/60 group">
                    <div class="flex-1 pr-4">
                        <div class="font-bold text-sm text-slate-800 mb-0.5">${c.name}</div>
                        <div class="text-[11px] text-slate-500 font-semibold bg-white inline-block px-1.5 py-0.5 rounded border border-slate-100">${c.qty} x Rp ${c.price.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-sm text-slate-700">Rp ${sub.toLocaleString('id-ID')}</span>
                        <button onclick="removeCart(${i})" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition-colors active:scale-90" title="Hapus">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
            document.getElementById('grand-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        async function checkout() {
            if (cart.length === 0) return alert('Silakan pilih menu terlebih dahulu!');
            
            const btn = document.getElementById('btn-checkout');
            const originContent = btn.innerHTML;
            
            // State loading tombol checkout
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MEMPROSES...`;
            btn.disabled = true;

            const totalBayar = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const detailStr = cart.map(i => `${i.name} (${i.qty}x)`).join(', ');
            
            const payload = {
                action: "checkout",
                id_trx: generateTrxId(),
                waktu: new Date().toLocaleString('id-ID'),
                detail_pesanan: detailStr,
                total_bayar: totalBayar
            };

            try {
                const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if (result.status === "success") {
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    
                    // Notifikasi sukses (bisa diganti dengan UI Toast yang lebih elegan jika mau)
                    alert('✅ Transaksi Berhasil Disimpan!');
                    
                    cart = [];
                    renderCart();
                    syncData(); 
                } else {
                    alert('Gagal menyimpan transaksi.');
                }
            } catch(e) {
                alert('Gagal jaringan. Pastikan koneksi internet Anda aktif.');
            }
            
            btn.innerHTML = originContent;
            btn.disabled = false;
        }

        // Modal Controls
        function openAddModal() { 
            document.getElementById('add-modal').classList.remove('hidden'); 
        }
        function closeAddModal() { 
            document.getElementById('add-modal').classList.add('hidden'); 
        }
        
        async function submitProduct() {
            const cat = document.getElementById('new-cat').value;
            const name = document.getElementById('new-name').value;
            const price = document.getElementById('new-price').value;
            
            if(!cat || !name || !price) return alert("Silakan lengkapi semua form!");

            const btn = document.getElementById('btn-save-product');
            const originText = btn.innerText;
            btn.innerText = "Menyimpan...";
            btn.disabled = true;
            
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "add_product", kategori: cat, nama: name, harga: parseInt(price) })
                });
                closeAddModal();
                document.getElementById('new-cat').value = '';
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                syncData(); 
            } catch(e) {
                alert("Gagal menambahkan produk. Periksa koneksi.");
            }
            
            btn.innerText = originText;
            btn.disabled = false;
        }

        // History Controls
        function toggleHistory() {
            document.getElementById('history-screen').classList.toggle('hidden');
        }
        
        function renderHistory() {
            const list = document.getElementById('history-list');
            if (dbHistory.length === 0) {
                list.innerHTML = `
                <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                    <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    <p class="font-medium">Belum ada transaksi hari ini.</p>
                </div>`;
                return;
            }

            let html = '';
            let totalHariIni = 0;
            
            dbHistory.forEach(trx => {
                totalHariIni += parseInt(trx.total);
                // UI Kartu Riwayat Baru
                html += `
                <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-slate-100 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3 border-b border-slate-50 pb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center text-blue-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-800">${trx.id}</div>
                                <div class="text-[11px] font-medium text-slate-400">${trx.waktu}</div>
                            </div>
                        </div>
                        <div class="font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg">Rp ${trx.total.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="text-xs font-medium text-slate-600 leading-relaxed pl-13">
                        <span class="text-slate-400 font-semibold mr-1">Pesanan:</span> ${trx.detail}
                    </div>
                </div>`;
            });
            
            // Ringkasan Hari Ini
            html = `
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 rounded-2xl mb-6 shadow-lg shadow-blue-500/30 text-white flex justify-between items-center">
                <div>
                    <p class="text-blue-100 text-xs font-bold uppercase tracking-wider mb-1">Pendapatan Hari Ini</p>
                    <h2 class="text-3xl font-black tracking-tight">Rp ${totalHariIni.toLocaleString('id-ID')}</h2>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>` + html;
                    
            list.innerHTML = html;
        }

        // PWA Setup
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
